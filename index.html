'use strict';
// ===== Core =====
const W = 960, H = 540, S = 2;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
function fit() { const sc = Math.min(innerWidth / W, innerHeight / H); cv.style.width = (W * sc) + 'px'; cv.style.height = (H * sc) + 'px'; }
addEventListener('resize', fit); fit();

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
function font(sz, w) { ctx.font = (w || 500) + ' ' + sz + 'px ' + FONT; }
function text(s, x, y, sz, col, al, w) { font(sz || 16, w); ctx.fillStyle = col || '#fff'; ctx.textAlign = al || 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); }
function wrapText(s, x, y, maxW, lh, sz, col, w, al) {
  font(sz, w); ctx.fillStyle = col; ctx.textAlign = al || 'left'; ctx.textBaseline = 'alphabetic';
  const words = s.split(' '); let ln = ''; let yy = y;
  for (const wd of words) { const t = ln ? ln + ' ' + wd : wd; if (ctx.measureText(t).width > maxW && ln) { ctx.fillText(ln, x, yy); ln = wd; yy += lh; } else ln = t; }
  if (ln) ctx.fillText(ln, x, yy);
  return yy;
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
let FACET = true;
const SHADE_CACHE = {};
function shadeC(col, a) { const k = col + a; return SHADE_CACHE[k] || (SHADE_CACHE[k] = shade(col, a)); }
function ell(x, y, rx, ry, col, rot) {
  if (FACET && rx >= 4 && ry >= 3 && typeof col === 'string' && col.length === 7 && col[0] === '#') { facetEll(x, y, rx, ry, col, rot || 0); return; }

  }
}
function seg(x1, y1, x2, y2, col, w) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke(); }
function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

// ===== Input =====
const mouse = { x: W / 2, y: H / 2 };

function toGame(cx, cy) { const r = cv.getBoundingClientRect(); return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H }; }
cv.addEventListener('mousemove', e => { const p = toGame(e.clientX, e.clientY); mouse.x = p.x; mouse.y = p.y; });

addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); ensureAudio(); if (G.screen === 'session') shoot(); } });

  UI.push({ x, y, w, h, fn: dis ? null : fn });

  for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }

// Walkable branch line: each main tree has two curved limbs rising from the trunk; thin branches reach the screen edges.

    rrect(px + 16, y - 15, 28, 16, 8); ctx.fillStyle = 'rgba(255,240,210,.9)'; ctx.fill(); text('H1', px + 30, y - 3, 10, '#4A3418', 'center', 700); text('Hari kamu pernah ke sini', px + 52, y, 13, '#E6EDE7', 'left', 500);
    return;
  }
  drawSpotPreview(shown, px + 14, py + 14, pw - 28, 132);
  rrect(px + 22, py + 22, 70, 20, 10); ctx.fillStyle = 'rgba(12,24,18,.75)'; ctx.fill(); text(shown.time, px + 57, py + 36, 12, '#FFE2C7', 'center', 700);
  text(shown.name, px + 18, py + 176, 20, '#FFF4E0', 'left', 800);
  text('Event: ' + shown.event.name, px + 18, py + 197, 13, '#F0A070', 'left', 600);
  let y = wrapText(shown.desc, px + 18, py + 222, pw - 36, 18, 13, '#D7E2D9', 400);
  y += 26; text('Satwa yang bisa ditemui', px + 18, y, 12, '#9FB5A5', 'left', 700);
  y = wrapText(shown.fauna.map(k => SPECIES[k].name).join(', '), px + 18, y + 18, pw - 36, 17, 13, '#E6EDE7', 400);
  if (G.regionCorrect && G.bonus[shown.id] > 0) { y += 24; text('↑ Petunjuk mengarah ke sini', px + 18, y, 13, '#FFD34D', 'left', 700); }
  if (G.reported[shown.id]) { y += 20; text('✓ Ancaman sudah dilaporkan', px + 18, y, 13, '#9FE0A8', 'left', 700); }
  if (G.selSpot === shown) button(px + 14, py + ph - 54, pw - 28, 40, 'Mulai sesi foto', () => startSession(shown), { primary: true, size: 16 });
  else text('Klik titik untuk memilih', px + pw / 2, py + ph - 26, 13, '#9FB5A5', 'center', 600);
}
function drawSummary() {
  const d = G.lastDay;
  ctx.fillStyle = '#14231B'; ctx.fillRect(0, 0, W, H);
  text('Ringkasan Hari ' + G.day + ' · ' + d.spot.name, 40, 50, 26, '#FFF4E0', 'left', 800);
  text('Skor total: ' + G.total, W - 40, 50, 16, '#FFE2C7', 'right', 600);
  if (!d.photos.length) text('Tidak ada foto hari ini.', 40, 130, 16, '#B9CBBE', 'left', 400);
  d.photos.forEach((p, i) => { const c = i % 4, r = Math.floor(i / 4); polaroid(p, 40 + c * 224, 72 + r * 176, 182, (i % 2 ? 0.02 : -0.02)); });
  let y = 436;
  if (G.offerSwitch) {
    rrect(40, 420, W - 80, 62, 12); ctx.fillStyle = '#2A3F31'; ctx.fill();
    wrapText('Warga: "' + ((G.mission.villager || {})[G.region] || 'Belum pernah ada yang melihat ' + G.mission.short + ' di sini.') + ' ' + G.mission.hint + '"', 58, 446, W - 120, 20, 14, '#F2E8D5', 400);
    button(W - 420, 492, 210, 38, 'Pindah daerah (1x)', () => { G.switchUsed = true; G.offerSwitch = false; G.day++; G.screen = G.day > G.maxDays ? 'archive' : 'map'; if (G.screen === 'archive') sfxSoft(); }, { primary: true, size: 15 });
    button(W - 200, 492, 160, 38, 'Tetap di sini', () => { G.switchUsed = true; G.offerSwitch = false; nextDay(); }, { size: 15 });
    return;
  }
  const lines = [];
  if (d.got) lines.push([tgtName() + ' berhasil didokumentasikan hari ini!', '#FFD98A']);
  else if (d.saw) lines.push([tgtName() + ' sempat muncul, tapi lolos dari kamera.', '#FFC2B0']);
  d.clues.forEach(c => lines.push(['Petunjuk: ' + c.text, '#BFF0C2']));
  if (d.reports.length) lines.push(['Laporan terkirim ke desa: ' + d.reports.join(', '), '#FFC2B0']);
  if (!lines.length) lines.push(['Tidak ada petunjuk baru hari ini.', '#B9CBBE']);
  lines.slice(0, 3).forEach(l => { text(l[0], 40, y, 14, l[1], 'left', 600); y += 20; });
  const last = G.day >= G.maxDays;
  if (G.targetFound && !last) button(W - 430, 492, 200, 38, 'Selesaikan misi', () => { G.screen = 'archive'; sfxGood(); }, { size: 15 });
  button(W - 220, 492, 180, 38, last ? 'Lihat hasil misi' : 'Lanjut ke Hari ' + (G.day + 1), () => nextDay(), { primary: true, size: 15 });
}
function nextDay() { G.day++; if (G.day > G.maxDays) { G.day = G.maxDays; G.screen = 'archive'; if (G.targetFound) sfxGood(); else sfxSoft(); } else G.screen = 'region'; }
function star(x, y, r, on) {
  ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5; const rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath();
  ctx.fillStyle = on ? '#FFD34D' : 'rgba(255,255,255,.15)'; ctx.fill();
}
function drawArchive() {
  ctx.fillStyle = '#14231B'; ctx.fillRect(0, 0, W, H);
  text('Arsip Desa', 40, 52, 26, '#FFF4E0', 'left', 800);
  if (G.bestTarget) {
    ctx.save(); ctx.translate(48, 82); ctx.rotate(-0.025); ctx.fillStyle = '#FBF8F1'; ctx.fillRect(0, 0, 384, 320);
    ctx.drawImage(G.bestTarget.img, 12, 12, 360, 244);
    text(tgtName() + ' · ' + SPECIES[tgtId()].latin, 14, 282, 15, '#222', 'left', 800);
    text('Teridentifikasi · kualitas ' + G.bestTarget.q + '% · Hari ' + G.bestTarget.day + ', ' + G.bestTarget.spot, 14, 304, 12, '#666', 'left', 500); ctx.restore();
  } else {
    rrect(48, 82, 384, 320, 10); ctx.fillStyle = '#1C3024'; ctx.fill(); ctx.strokeStyle = '#2F4637'; ctx.lineWidth = 2; ctx.stroke();
    text('Belum ada foto ' + tgtName(), 240, 240, 18, '#7E9A88', 'center', 700);
  }
  const s1 = G.targetFound, s2 = !!(G.bestTarget && G.bestTarget.q >= 70), s3 = G.reports >= 3 && G.species.size >= 5;
  const x = 480;
  text(s1 ? 'Misi berhasil' : 'Misi belum berhasil', x, 112, 32, s1 ? '#FFE2A3' : '#FFC2B0', 'left', 800);
  star(x + 18, 146, 16, s1); star(x + 56, 146, 16, s2); star(x + 94, 146, 16, s3);
  const crit = [[s1, 'Foto ' + tgtName() + ' didapat'], [s2, 'Foto ' + tgtName() + ' berkualitas 70% ke atas'], [s3, 'Minimal 3 laporan ancaman dan 5 spesies']];
  let y = 190; crit.forEach(c => { text(c[0] ? '✓' : '✗', x, y, 15, c[0] ? '#BFF0C2' : '#FFB4A0', 'left', 800); text(c[1], x + 22, y, 15, '#E6EDE7', 'left', 500); y += 24; });
  y += 8; text('Spesies terdokumentasi: ' + G.species.size + '   ·   Laporan: ' + G.reports + '   ·   Skor: ' + G.total, x, y, 14, '#FFE2C7', 'left', 600);
  y = wrapText(Array.from(G.species.keys()).join(', ') || '-', x, y + 22, 430, 18, 13, '#B9CBBE', 400);
  rrect(x, y + 18, 440, 110, 12); ctx.fillStyle = '#20362A'; ctx.fill();
  wrapText(G.mission.fact, x + 16, y + 44, 408, 19, 13.5, '#E6EDE7', 400);
  button(48, 470, 180, 44, 'Ulangi misi', () => newMission(G.mission), { primary: true });
  button(244, 470, 160, 44, 'Menu utama', () => { G.screen = 'menu'; });
}

// ===== Loop =====
let lastTs = 0, prevScreen = '', fade = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0); lastTs = ts; G.time += dt;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  UI = []; hovering = false;
  if (G.screen === 'session') { updSession(dt); if (G.screen === 'session') drawSession(); }
  if (G.screen === 'menu') { drawMenu(); if (G.howto) drawHowto(); }
  else if (G.screen === 'missions') drawMissions();
  else if (G.screen === 'map') drawMap();
  else if (G.screen === 'region') drawRegion();
  else if (G.screen === 'summary') drawSummary();
  else if (G.screen === 'archive') drawArchive();
  if (G.screen !== prevScreen) { fade = prevScreen ? 0.85 : 1; prevScreen = G.screen; }
  if (fade > 0) { ctx.fillStyle = 'rgba(8,14,10,' + fade + ')'; ctx.fillRect(0, 0, W, H); fade = Math.max(0, fade - dt * 3.2); }
  cv.style.cursor = G.screen === 'session' ? 'none' : (hovering ? 'pointer' : 'default');
  requestAnimationFrame(frame);
}
window.__G = G; window.__SS = () => SS; // debug hooks
requestAnimationFrame(frame);
setTimeout(() => { for (const k in LAYOUTS) getLayers(LAYOUTS[k]); }, 300);
</script>
