'use strict';
// ===== Core =====
const W = 960, H = 540, S = 2;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
function fit() { const sc = Math.min(innerWidth / W, innerHeight / H); cv.style.width = (W * sc) + 'px'; cv.style.height = (H * sc) + 'px'; }
addEventListener('resize', fit); fit();

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
function font(sz, w) { ctx.font = (w || 500) + ' ' + sz + 'px ' + FONT; }
function text(s, x, y, sz, col, al, w) { font(sz || 16, w); ctx.fillStyle = col || '#fff'; ctx.textAlign = al || 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); }
function wrapText(s, x, y, maxW, lh, sz, col, w, al) {
  font(sz, w); ctx.fillStyle = col; ctx.textAlign = al || 'left'; ctx.textBaseline = 'alphabetic';
  const words = s.split(' '); let ln = ''; let yy = y;
  for (const wd of words) { const t = ln ? ln + ' ' + wd : wd; if (ctx.measureText(t).width > maxW && ln) { ctx.fillText(ln, x, yy); ln = wd; yy += lh; } else ln = t; }
  if (ln) ctx.fillText(ln, x, yy);
  return yy;
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
let FACET = true;
const SHADE_CACHE = {};
function shadeC(col, a) { const k = col + a; return SHADE_CACHE[k] || (SHADE_CACHE[k] = shade(col, a)); }
function ell(x, y, rx, ry, col, rot) {
  if (FACET && rx >= 4 && ry >= 3 && typeof col === 'string' && col.length === 7 && col[0] === '#') { facetEll(x, y, rx, ry, col, rot || 0); return; }
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
}
function facetEll(x, y, rx, ry, col, rot) {
  const n = rx * ry > 260 ? 9 : 7, cr = Math.cos(rot), sr = Math.sin(rot), pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + .35; const px = Math.cos(a) * rx, py = Math.sin(a) * ry; pts.push([x + px * cr - py * sr, y + px * sr + py * cr]); }
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  const cx = x - rx * .14, cy = y - ry * .18, lite = shadeC(col, .17), dark = shadeC(col, -.16);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n]; const mx = (p[0] + q[0]) / 2 - x, my = (p[1] + q[1]) / 2 - y; const b = (-mx * .62 - my * .78) / (Math.hypot(mx, my) || 1);
    if (b > -.35 && b < .3) continue; ctx.fillStyle = b >= .3 ? lite : dark; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.closePath(); ctx.fill();
  }
}
function seg(x1, y1, x2, y2, col, w) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke(); }
function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

// ===== Input =====
const mouse = { x: W / 2, y: H / 2 };
let UI = [], hovering = false;
function toGame(cx, cy) { const r = cv.getBoundingClientRect(); return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H }; }
cv.addEventListener('mousemove', e => { const p = toGame(e.clientX, e.clientY); mouse.x = p.x; mouse.y = p.y; });
cv.addEventListener('mousedown', e => { const p = toGame(e.clientX, e.clientY); mouse.x = p.x; mouse.y = p.y; onPress(); });
cv.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; const p = toGame(t.clientX, t.clientY); mouse.x = p.x; mouse.y = p.y; }, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); const t = e.changedTouches[0]; const p = toGame(t.clientX, t.clientY); mouse.x = p.x; mouse.y = p.y; }, { passive: false });
cv.addEventListener('touchend', e => { e.preventDefault(); onPress(); }, { passive: false });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); ensureAudio(); if (G.screen === 'session') shoot(); } });
function onPress() {
  ensureAudio();
  if (G.screen === 'session') { shoot(); return; }
  for (let i = UI.length - 1; i >= 0; i--) {
    const u = UI[i]; const hit = u.hit ? u.hit(mouse.x, mouse.y) : inRect(mouse.x, mouse.y, u);
    if (hit && u.fn) { sfxClick(); u.fn(); return; }
  }
}
function button(x, y, w, h, label, fn, opt) {
  opt = opt || {};
  const hov = inRect(mouse.x, mouse.y, { x, y, w, h }); const dis = !!opt.disabled;
  UI.push({ x, y, w, h, fn: dis ? null : fn });
  rrect(x, y, w, h, 10);
  ctx.fillStyle = dis ? 'rgba(255,255,255,.14)' : (opt.primary ? (hov ? '#F0894A' : '#E07A3F') : (hov ? '#FFFFFF' : '#F2E8D5'));
  ctx.fill();
  text(label, x + w / 2, y + h / 2 + 6, opt.size || 17, dis ? 'rgba(255,255,255,.45)' : (opt.primary ? '#FFFFFF' : '#1E2B22'), 'center', 600);
  if (hov && !dis) hovering = true;
}

  o.start(t); o.stop(t + dur + 0.05);

  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n) * 0.5;
  const src = AC.createBufferSource(); src.buffer = b; const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 3200; const g = AC.createGain(); g.gain.value = 0.12;
  src.connect(f); f.connect(g); if (AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan || 0)); g.connect(p); p.connect(AC.destination); } else g.connect(AC.destination); src.start();
}
const panOf = x => (x / W) * 2 - 1;
const CALLS = {
  bekantan: p => { tone(195, .22, 'sawtooth', .045, 0, -45, p); tone(170, .28, 'sawtooth', .045, .3, -45, p); },
  pekakak: p => { for (let i = 0; i < 6; i++) tone(2000 - i * 130, .06, 'square', .016, i * .085, -160, p); },
  kuntul: p => { tone(150, .16, 'sawtooth', .03, 0, -35, p); tone(130, .14, 'sawtooth', .025, .2, -30, p); },
  kera: p => { for (let i = 0; i < 3; i++) tone(900 + Math.random() * 400, .06, 'triangle', .03, i * .09, 320, p); },
  daralaut: p => { tone(2700, .11, 'sine', .03, 0, -800, p); tone(2500, .09, 'sine', .025, .16, -600, p); },
  biawak: p => hiss(p),
  kepiting: p => { tone(3100, .015, 'square', .014, 0, 0, p); tone(3300, .015, 'square', .014, .07, 0, p); tone(3000, .015, 'square', .012, .13, 0, p); },
  tembakul: p => { tone(520, .06, 'sine', .025, 0, -260, p); }
};
function sfxShutter() {

  const b = AC.createBuffer(1, n, AC.sampleRate); const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const src = AC.createBufferSource(); src.buffer = b; const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1800;
  const g = AC.createGain(); g.gain.value = 0.45; src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);

}
function sfxClick() { tone(700, 0.05, 'triangle', 0.05); }
function sfxChime() { tone(660, 0.25, 'sine', 0.1); tone(990, 0.4, 'sine', 0.08, 0.13); }
function sfxGood() { tone(523, 0.18, 'triangle', 0.11); tone(659, 0.18, 'triangle', 0.11, 0.12); tone(784, 0.35, 'triangle', 0.11, 0.24); }
function sfxSoft() { tone(440, 0.2, 'sine', 0.05); }

function chirp() { tone(rnd(2300, 3400), 0.07, 'sine', 0.025, 0, rnd(-700, 700)); tone(rnd(2300, 3400), 0.06, 'sine', 0.02, 0.1, rnd(-500, 500)); }
function startAmb(kind) {
  stopAmb(); if (!AC) return;
  const n = AC.sampleRate * 2; const b = AC.createBuffer(1, n, AC.sampleRate); const d = b.getChannelData(0); let last = 0;
  for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
  const src = AC.createBufferSource(); src.buffer = b; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = kind === 'estuary' ? 900 : 520;
  const g = AC.createGain(); g.gain.setValueAtTime(0, AC.currentTime); g.gain.linearRampToValueAtTime(0.12, AC.currentTime + 1.5);
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start(); amb = { src, g };

  amb = null;

// Walkable branch line: each main tree has two curved limbs rising from the trunk; thin branches reach the screen edges.
function limbY(c, d) { return c.y + 10 - 18 * d + 6 * Math.sin(Math.PI * d); }
function branchY(L, x) {

// ===== Loop =====
let lastTs = 0, prevScreen = '', fade = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0); lastTs = ts; G.time += dt;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  UI = []; hovering = false;

  else if (G.screen === 'archive') drawArchive();

window.__G = G; window.__SS = () => SS; // debug hooks
